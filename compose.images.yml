services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Definir DB_NAME en el archivo .env de la raiz}
      POSTGRES_USER: ${DB_USER:?Definir DB_USER en el archivo .env de la raiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el archivo .env de la raiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:?Definir DB_USER en .env} -d ${DB_NAME:?Definir DB_NAME en .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: itdata-backend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      DEBUG: "release"
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY en el archivo .env de la raiz}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Definir ALLOWED_HOSTS en el archivo .env de la raiz}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_NAME: ${DB_NAME:?Definir DB_NAME en el archivo .env de la raiz}
      DB_USER: ${DB_USER:?Definir DB_USER en el archivo .env de la raiz}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el archivo .env de la raiz}
      DB_HOST: db
      DB_PORT: "5432"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: itdata-web:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  internal:
    driver: bridge
